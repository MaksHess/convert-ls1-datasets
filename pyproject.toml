[project]
name = "convert-ls1-datasets"
version = "0.1.0"
description = "Convert LS1 microscopy datasets (channels, labels, meshes, lineage trees)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "colorcet>=3.2.1",
    "dca-helpers",
    "geff",
    "imagecodecs>=2026.5.10",
    "matplotlib>=3.10.9",
    "ngio>=0.5.9",
    "pandas>=2.3.3",
    "polars>=1.40.1",
    "rich-click>=1.9.7",
    "rustworkx>=0.17.1",
    "seaborn>=0.13.2",
    "tables>=3.11.1",
    "tifffile>=2026.5.2",
]

[project.scripts]
convert-ls1-dataset = "convert_dataset:main"
convert-geff-like-to-geff = "convert_geff_like_to_geff:main"
export-zenodo-dataset = "export_zenodo_dataset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["convert_dataset.py", "lstree_to_tracks.py", "parse_ldp_ls1_data.py"]

[tool.uv.sources]
geff = { git = "https://github.com/MaksHess/geff", subdirectory = "packages/geff", branch = "fix/node-props-order" }
dca-helpers = { git = "https://github.com/chanzuckerberg/dynamic-cell-atlas-specs.git", rev = "v0.2.7" }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "napari>=0.6.5",
    "pyqt6>=6.11.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
